services:
  - type: web
    name: intellivest-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn intellivest.api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: INTELLIVEST_LLM_PROVIDER
        value: deterministic
